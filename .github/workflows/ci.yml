# Release gate. main auto-deploys (Railway + Vercel), so nothing merges
# unless the backend tests, the migration history, the web tests and the
# web build all pass. Nothing here touches the real database.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Unreachable on purpose: any query a test forgets to mock fails.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/none
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:1/none
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm test

  # The migration history must build the exact schema in schema.prisma on an
  # empty database — what `prisma migrate deploy` does on every deploy — and
  # the import → approve → report → export journeys must hold on it.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fresh
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/fresh
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/fresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy
      - name: Fail if the migrated database differs from schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npx prisma generate
      - name: Money journeys on the migrated database
        run: npm run test:integration
        env:
          INTEGRATION_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/fresh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
